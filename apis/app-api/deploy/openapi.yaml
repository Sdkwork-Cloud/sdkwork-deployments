        fileName:
          type: string
          maxLength: 500
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64
        checksum:
          type: string
        idempotencyKey:
          type: string
          maxLength: 128
    DeployUploadSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        packageType:
          type: integer
        fileName:
          type: string
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64
        checksum:
          type: string
        status:
          type: integer
          description: 0=pending, 1=completed, 2=cancelled
        driveUploadSessionId:
          type: string
        driveUploadItemId:
          type: string
        driveSpaceId:
          type: string
        driveNodeId:
