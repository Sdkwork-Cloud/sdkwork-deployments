openapi: 3.1.2
info:
  title: SDKWork Deploy App API
  description: SDKWork Deploy Server 应用端 API，供前端应用客户端调用
  version: 1.0.0
  contact:
    name: SDKWork Team
servers:
  - url: https://api.deploy.sdkwork.com
    description: Production
  - url: http://localhost:3900
    description: Local Development

security:
  - AuthToken: []
    AccessToken: []

paths:
  /app/v3/api/sites:
    get:
      operationId: sites.list
      summary: 获取站点列表
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1, 2, 3]
        - name: siteType
          in: query
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5, 6]
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: sites.create
      summary: 创建站点
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/v3/api/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.retrieve
      summary: 获取站点详情
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: sites.update
      summary: 更新站点
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: sites.delete
      summary: 删除站点
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: 删除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/activate:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    post:
      operationId: sites.activate
      summary: 激活站点
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/pause:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    post:
      operationId: sites.pause
      summary: 暂停站点
      tags: [site]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 暂停成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/domains:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.domains.list
      summary: 获取站点域名列表
      tags: [domain]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: sites.domains.create
      summary: 绑定域名
      tags: [domain]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /app/v3/api/sites/{siteId}/domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/DomainIdParam'
    get:
      operationId: sites.domains.retrieve
      summary: 获取域名详情
      tags: [domain]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: sites.domains.delete
      summary: 解绑域名
      tags: [domain]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/domains/{domainId}/verify:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/DomainIdParam'
    post:
      operationId: sites.domains.verify
      summary: 验证域名所有权
      tags: [domain]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/deployments:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.deployments.list
      summary: 获取部署历史
      tags: [deployment]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1, 2, 3, 4, 5]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: sites.deployments.create
      summary: 发起部署
      tags: [deployment]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: 部署已触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /app/v3/api/sites/{siteId}/deployments/{deploymentId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/DeploymentIdParam'
    get:
      operationId: sites.deployments.retrieve
      summary: 获取部署详情
      tags: [deployment]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/deployments/{deploymentId}/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/DeploymentIdParam'
    post:
      operationId: sites.deployments.rollback
      summary: 回滚部署
      tags: [deployment]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 回滚成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/releases:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.releases.list
      summary: 获取站点发布版本列表
      tags: [release]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sites.releases.create
      summary: 从制品创建不可变发布版本
      tags: [release]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/v3/api/sites/{siteId}/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/ReleaseIdParam'
    get:
      operationId: sites.releases.retrieve
      summary: 获取发布版本详情
      tags: [release]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/env_variables:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.envVariables.list
      summary: 获取环境变量列表
      tags: [envVariable]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - name: environment
          in: query
          schema:
            type: string
            default: production
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVariablePage'
    post:
      operationId: sites.envVariables.create
      summary: 创建环境变量
      tags: [envVariable]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvVariableRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVariableResponse'

  /app/v3/api/certificates:
    get:
      operationId: certificates.list
      summary: 获取证书列表
      tags: [certificate]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatePage'
    post:
      operationId: certificates.create
      summary: 申请证书
      tags: [certificate]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRequest'
      responses:
        '201':
          description: 证书申请已触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'

  /app/v3/api/certificates/{certificateId}:
    parameters:
      - $ref: '#/components/parameters/CertificateIdParam'
    get:
      operationId: certificates.retrieve
      summary: 获取证书详情
      tags: [certificate]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: certificates.delete
      summary: 撤销证书
      description: 将证书标记为已撤销；私钥与证书文件仍由 Drive 生命周期管理。
      tags: [certificate]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: 撤销成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/certificates/{certificateId}/renew:
    parameters:
      - $ref: '#/components/parameters/CertificateIdParam'
    post:
      operationId: certificates.renew
      summary: 计划托管证书续期
      description: |
        仅适用于 Let's Encrypt 托管证书（certType=1）。将 renewal_status 置为已计划；
        ACME 自动化 worker 尚未上线时不会立即签发新证书。自定义证书须通过 certificates.upload 替换。
      tags: [certificate]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 续期已计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/v3/api/certificates/upload:
    post:
      operationId: certificates.upload
      summary: 从已完成的 Drive 上传会话注册自定义 TLS 证书
      description: |
        客户端须先通过 uploadSessions 上传并完成证书 PEM（packageType=6）
        与私钥 PEM（packageType=7），再调用本接口绑定元数据。响应不包含私钥内容。
      tags: [certificate]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCustomCertificateRequest'
      responses:
        '201':
          description: 证书已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/v3/api/upload_sessions:
    post:
      operationId: uploadSessions.create
      summary: 创建 Drive-backed 包上传会话
      tags: [uploadSession]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeployUploadSessionRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUploadSessionResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /app/v3/api/upload_sessions/{uploadSessionId}:
    parameters:
      - name: uploadSessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: uploadSessions.retrieve
      summary: 获取上传会话
      tags: [uploadSession]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUploadSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/upload_sessions/{uploadSessionId}/complete:
    parameters:
      - name: uploadSessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: uploadSessions.complete
      summary: 完成上传会话
      description: 完成 Drive 上传；packageType 1–5 时同步创建不可变 deploy_artifact 记录。
      tags: [uploadSession]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteDeployUploadSessionRequest'
      responses:
        '200':
          description: 完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUploadSessionResponse'

  /app/v3/api/upload_sessions/{uploadSessionId}/cancel:
    parameters:
      - name: uploadSessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: uploadSessions.cancel
      summary: 取消上传会话
      tags: [uploadSession]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDeployUploadSessionRequest'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUploadSessionResponse'

  /app/v3/api/artifacts:
    get:
      operationId: artifacts.list
      summary: 获取租户制品列表
      description: 包上传会话完成（packageType 1–5）后自动创建不可变制品记录。
      tags: [artifact]
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /app/v3/api/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactIdParam'
    get:
      operationId: artifacts.retrieve
      summary: 获取制品详情
      tags: [artifact]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: artifacts.retain
      summary: 保留并下架制品
      description: 将制品标记为 retained；Drive 节点生命周期仍由 Drive 管理。
      tags: [artifact]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: 已保留
        '404':
          $ref: '#/components/responses/NotFound'

  /app/v3/api/sites/{siteId}/health_checks:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.healthChecks.list
      summary: 获取健康检查配置
      tags: [monitor]
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckPage'
    post:
      operationId: sites.healthChecks.create
      summary: 创建健康检查
      tags: [monitor]
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHealthCheckRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
          maximum: 200
        minimum: 1
        maximum: 100
        default: 20
    SiteIdParam:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainIdParam:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentIdParam:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateIdParam:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactIdParam:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseIdParam:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string

    CreateSiteRequest:
      type: object
      required: [name, siteType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
