    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: integer
          format: int32
          minimum: 40011
          maximum: 40099
        i18nKey:
          type: string
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
    SdkWorkResourceResponse:
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/SdkWorkResourceData'
    SdkWorkListResponse:
