    SdkWorkCommandResponse:
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/SdkWorkCommandData'
  responses:
    BadRequest:
      description: "请求参数错误"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: "未认证"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: "Access denied"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: "资源不存在"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: "资源冲突"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: "校验错误"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    RateLimited:
      description: "请求过于频繁"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
