          format: uuid
        certName:
          type: string
        certificateSource:
          type: string
          enum: [MANAGED, CUSTOM]
        caProfile:
          type: string
          enum: [LETS_ENCRYPT_STAGING, LETS_ENCRYPT_PRODUCTION, CUSTOM]
        preferredKeyAlgorithm:
          type: string
          enum: [RSA, ECDSA]
        identifiers:
          type: array
          items:
            type: string
            format: hostname
        currentVersionId:
          type: string
          format: uuid
        issuer:
          type: string
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        autoRenew:
          type: boolean
        renewalStatus:
          type: string
          enum: [NONE, PLANNED, PROCESSING, FAILED]
        status:
          type: string
          enum: [PENDING, ISSUING, ACTIVE, EXPIRED, FAILED, REVOKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: '^[0-9]+$'
    CertificatePage:
      type: object
      properties:
        items:
          type: array
