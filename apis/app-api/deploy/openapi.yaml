openapi: 3.1.2
info:
  title: SDKWork Deploy App API
  description: "SDKWork Deploy Server 应用端 API，供前端应用客户端调用"
  version: 1.0.0
  contact:
    name: SDKWork Team
servers:
  - url: https://api.deploy.sdkwork.com
    description: Production
  - url: http://localhost:3900
    description: Local Development
security:
  - AuthToken: []
    AccessToken: []
paths:
  /app/v3/api/domain_zones:
    get:
      operationId: domainZones.list
      summary: List root domain zones
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED]
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 253
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DomainZoneResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: domainZones.create
      summary: Define a root domain zone
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainZoneRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/DomainZoneResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /app/v3/api/domain_zones/{zoneId}:
    parameters:
      - $ref: '#/components/parameters/DomainZoneIdParam'
    get:
      operationId: domainZones.retrieve
      summary: Retrieve a root domain zone
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/DomainZoneResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: domainZones.update
      summary: Update a root domain zone
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDomainZoneRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/DomainZoneResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: domainZones.delete
      summary: Delete an empty root domain zone
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /app/v3/api/domain_zones/{zoneId}/hostnames:
    parameters:
      - $ref: '#/components/parameters/DomainZoneIdParam'
    get:
      operationId: domainZones.hostnames.list
      summary: List hostnames in a root domain zone
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DomainHostnameResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: domainZones.hostnames.create
      summary: Create a hostname in a root domain zone
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainHostnameRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/DomainHostnameResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /app/v3/api/domain_zones/{zoneId}/hostnames/{hostnameId}:
    parameters:
      - $ref: '#/components/parameters/DomainZoneIdParam'
      - $ref: '#/components/parameters/DomainHostnameIdParam'
    get:
      operationId: domainZones.hostnames.retrieve
      summary: Retrieve a domain hostname
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/DomainHostnameResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: domainZones.hostnames.delete
      summary: Delete an unbound domain hostname
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /app/v3/api/domain_zones/{zoneId}/hostnames/{hostnameId}/verify:
    parameters:
      - $ref: '#/components/parameters/DomainZoneIdParam'
      - $ref: '#/components/parameters/DomainHostnameIdParam'
    post:
      operationId: domainZones.hostnames.verify
      summary: Verify domain hostname ownership
      tags:
        - domain
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: Verification state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/DomainVerifyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /app/v3/api/sites:
    get:
      operationId: sites.list
      summary: "获取站点列表"
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
        - name: siteType
          in: query
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/SiteResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: sites.create
      summary: 创建站点
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: "创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/SiteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /app/v3/api/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.retrieve
      summary: "获取站点详情"
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: sites.update
      summary: 更新站点
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: "更新成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: sites.delete
      summary: 删除站点
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '204':
          description: "删除成功"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /app/v3/api/sites/{siteId}/activate:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    post:
      operationId: sites.activate
      summary: "激活站点"
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: "激活成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /app/v3/api/sites/{siteId}/composition:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    put:
      operationId: sites.composition.update
      summary: Replace and publish the complete live website composition
      description: >-
        Atomically replaces the normalized site composition, appends an immutable SiteRevision,
        and enqueues complete runtime-set assignments. Live Drive or Knowledgebase content changes
        do not call this operation and do not create releases or deployments.
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      x-sdkwork-permission: deploy.sites.write
      parameters:
        - $ref: '#/components/parameters/IfMatchParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteCompositionRequest'
      responses:
        '200':
          description: The composition revision and runtime assignments were committed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/SiteCompositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /app/v3/api/sites/{siteId}/pause:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    post:
      operationId: sites.pause
      summary: 暂停站点
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: "暂停成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /app/v3/api/sites/{siteId}/deployments:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.deployments.list
      summary: "获取部署历史"
      tags:
        - deployment
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
              - 5
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DeploymentResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: sites.deployments.create
      summary: "发起部署"
      tags:
        - deployment
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: "部署已触发"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/DeploymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /app/v3/api/sites/{siteId}/deployments/{deploymentId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/DeploymentIdParam'
    get:
      operationId: sites.deployments.retrieve
      summary: "获取部署详情"
      tags:
        - deployment
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/DeploymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /app/v3/api/sites/{siteId}/deployments/{deploymentId}/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/DeploymentIdParam'
    post:
      operationId: sites.deployments.rollback
      summary: "回滚部署"
      tags:
        - deployment
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: "回滚成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/DeploymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /app/v3/api/sites/{siteId}/releases:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.releases.list
      summary: "获取站点发布版本列表"
      tags:
        - release
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ReleaseResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sites.releases.create
      summary: "从制品创建不可变发布版本"
      tags:
        - release
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '201':
          description: "创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/ReleaseResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /app/v3/api/sites/{siteId}/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/ReleaseIdParam'
    get:
      operationId: sites.releases.retrieve
      summary: "获取发布版本详情"
      tags:
        - release
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/ReleaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /app/v3/api/sites/{siteId}/env_variables:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    get:
      operationId: sites.envVariables.list
      summary: "获取环境变量列表"
      tags:
        - envVariable
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - name: environment
          in: query
          schema:
            type: string
            default: production
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
