components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SiteIdParam:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the decimal-string Site version, for example `"3"`.
      schema:
        type: string
        pattern: '^("[0-9]+"|[0-9]+)$'
        maxLength: 24
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable command identity. Reuse with a different request is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    DomainZoneIdParam:
      name: zoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainHostnameIdParam:
      name: hostnameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentIdParam:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateIdParam:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactIdParam:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseIdParam:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/SdkWorkPlatformErrorCode'
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        i18nKey:
          type: string
          description: Optional stable localization key such as errors.result.40001.
        locale:
          type: string
          description: Optional effective BCP 47 locale used by framework message mapping.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    CreateSiteRequest:
      type: object
      required:
        - name
        - siteType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9][a-z0-9\-]*[a-z0-9]$
        description:
          type: string
          maxLength: 500
        siteType:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
        runtimeConfig:
          type: object
          properties:
            buildCommand:
              type: string
            outputDirectory:
              type: string
            nodeVersion:
              type: string
            installCommand:
              type: string
            startCommand:
              type: string
    UpdateSiteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        runtimeConfig:
          type: object
    UpdateSiteCompositionRequest:
      type: object
      additionalProperties: false
      required:
        - environment
        - defaultVariantKey
        - resources
        - variants
        - mounts
        - bindings
      properties:
        environment:
          $ref: '#/components/schemas/SiteEnvironment'
        defaultVariantKey:
          $ref: '#/components/schemas/CompositionKey'
        resources:
          type: array
          minItems: 1
          maxItems: 512
          items:
            $ref: '#/components/schemas/SiteResourceDefinition'
        variants:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/SiteVariantDefinition'
        variantRules:
          type: array
          maxItems: 1024
          default: []
          items:
            $ref: '#/components/schemas/SiteVariantRuleDefinition'
        mounts:
          type: array
          minItems: 1
          maxItems: 2048
          items:
            $ref: '#/components/schemas/SiteMountDefinition'
        bindings:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/SiteBindingDefinition'
        deliveryPolicy:
          $ref: '#/components/schemas/SiteDeliveryPolicy'
        securityPolicy:
          $ref: '#/components/schemas/SiteSecurityPolicy'
        limits:
          $ref: '#/components/schemas/SiteRuntimeLimits'
        observabilityPolicy:
          $ref: '#/components/schemas/SiteObservabilityPolicy'
    SiteEnvironment:
      type: string
      enum: [development, test, staging, production]
    CompositionKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
    SiteResourceDefinition:
      type: object
      additionalProperties: false
      required: [key, source]
      properties:
        key:
          $ref: '#/components/schemas/CompositionKey'
        source:
          oneOf:
            - $ref: '#/components/schemas/DriveDirectorySource'
            - $ref: '#/components/schemas/KnowledgebaseWikiSource'
          discriminator:
            propertyName: type
            mapping:
              DRIVE_DIRECTORY: '#/components/schemas/DriveDirectorySource'
              KNOWLEDGEBASE_WIKI: '#/components/schemas/KnowledgebaseWikiSource'
    DriveDirectorySource:
      type: object
      additionalProperties: false
      required: [type, websiteSpaceId, root, contentMode]
      properties:
        type:
          const: DRIVE_DIRECTORY
        websiteSpaceId:
          type: string
          minLength: 1
          maxLength: 128
        root:
          oneOf:
            - $ref: '#/components/schemas/DriveSpaceRootSelector'
            - $ref: '#/components/schemas/DriveFolderSelector'
          discriminator:
            propertyName: mode
        contentMode:
          type: string
          enum: [LIVE_TREE, ATOMIC_GENERATION]
    DriveSpaceRootSelector:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          const: SPACE_ROOT
    DriveFolderSelector:
      type: object
      additionalProperties: false
      required: [mode, folderNodeId]
      properties:
        mode:
          const: FOLDER
        folderNodeId:
          type: string
          minLength: 1
          maxLength: 128
    KnowledgebaseWikiSource:
      type: object
      additionalProperties: false
      required: [type, publicationUuid]
      properties:
        type:
          const: KNOWLEDGEBASE_WIKI
        publicationUuid:
          type: string
          minLength: 1
          maxLength: 128
    SiteVariantDefinition:
      type: object
      additionalProperties: false
      required: [key, label]
      properties:
        key:
          $ref: '#/components/schemas/CompositionKey'
        label:
          type: string
          minLength: 1
          maxLength: 64
        clientClass:
          type: string
          enum: [DESKTOP, MOBILE, TABLET, TV, BOT, OTHER]
          default: OTHER
        priority:
          type: integer
          minimum: 0
          maximum: 65535
          default: 0
    SiteVariantRuleDefinition:
      type: object
      additionalProperties: false
      required: [key, targetVariantKey, priority, match]
      properties:
        key:
          $ref: '#/components/schemas/CompositionKey'
        targetVariantKey:
          $ref: '#/components/schemas/CompositionKey'
        priority:
          type: integer
          minimum: 0
          maximum: 65535
        match:
          oneOf:
            - $ref: '#/components/schemas/PathPrefixVariantMatch'
            - $ref: '#/components/schemas/ClientClassVariantMatch'
          discriminator:
            propertyName: type
    PathPrefixVariantMatch:
      type: object
      additionalProperties: false
      required: [type, pathPrefix]
      properties:
        type:
          const: PATH_PREFIX
        pathPrefix:
          type: string
          minLength: 1
          maxLength: 4096
    ClientClassVariantMatch:
      type: object
      additionalProperties: false
      required: [type, clientClass]
      properties:
        type:
          const: CLIENT_CLASS
        clientClass:
          type: string
          enum: [DESKTOP, MOBILE, TABLET, TV, BOT, OTHER]
    SiteMountDefinition:
      type: object
      additionalProperties: false
      required: [key, variantKey, resourceKey, pathPrefix, resourceSubpath, mode, handler]
      properties:
        key:
          $ref: '#/components/schemas/CompositionKey'
        variantKey:
          $ref: '#/components/schemas/CompositionKey'
        resourceKey:
          $ref: '#/components/schemas/CompositionKey'
        pathPrefix:
          type: string
          minLength: 1
          maxLength: 4096
        resourceSubpath:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [ROOT, ALIAS]
        handler:
          type: string
          enum: [STATIC, SPA, WIKI]
        indexFiles:
          type: array
          maxItems: 16
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 255
        spaFallback:
          type: [string, 'null']
          maxLength: 4096
        priority:
          type: integer
          minimum: 0
          maximum: 65535
          default: 0
    SiteBindingDefinition:
      type: object
      additionalProperties: false
      required: [key, domainId, action]
      properties:
        key:
          $ref: '#/components/schemas/CompositionKey'
        domainId:
          type: string
          format: uuid
        pathPrefix:
          type: string
          minLength: 1
          maxLength: 4096
          default: /
        action:
          oneOf:
            - $ref: '#/components/schemas/ServeBindingAction'
            - $ref: '#/components/schemas/RedirectBindingAction'
          discriminator:
            propertyName: type
    ServeBindingAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: SERVE
        defaultVariantKey:
          type: [string, 'null']
          maxLength: 64
        forcedVariantKey:
          type: [string, 'null']
          maxLength: 64
    RedirectBindingAction:
      type: object
      additionalProperties: false
      required: [type, statusCode, scheme, hostname, pathPrefix]
      properties:
        type:
          const: REDIRECT
        statusCode:
          type: integer
          enum: [301, 302, 307, 308]
        scheme:
          type: string
          enum: [http, https]
        hostname:
          type: string
          minLength: 1
          maxLength: 255
        pathPrefix:
          type: string
          minLength: 1
          maxLength: 4096
        preservePath:
          type: boolean
          default: true
        preserveQuery:
          type: boolean
          default: true
    SiteDeliveryPolicy:
      type: object
      additionalProperties: false
      properties:
        providerTimeoutMs: {type: integer, minimum: 1, default: 5000}
        metadataCacheTtlSeconds: {type: integer, minimum: 0, default: 60}
        negativeCacheTtlSeconds: {type: integer, minimum: 0, default: 5}
        staleWhileRevalidateSeconds: {type: integer, minimum: 0, default: 30}
        maximumObjectBytes: {type: integer, minimum: 1, default: 1073741824}
    SiteSecurityPolicy:
      type: object
      additionalProperties: false
      properties:
        forceHttps: {type: boolean, default: true}
        denyDotFiles: {type: boolean, default: true}
        deniedPathPrefixes:
          type: array
          maxItems: 64
          default: [/.git, /.sdkwork]
          items: {type: string, maxLength: 4096}
    SiteRuntimeLimits:
      type: object
      additionalProperties: false
      properties:
        maximumBindings: {type: integer, minimum: 1, maximum: 1024, default: 64}
        maximumVariants: {type: integer, minimum: 1, maximum: 64, default: 16}
        maximumVariantRules: {type: integer, minimum: 0, maximum: 1024, default: 64}
        maximumResources: {type: integer, minimum: 1, maximum: 512, default: 64}
        maximumMounts: {type: integer, minimum: 1, maximum: 2048, default: 256}
        maximumIndexFilesPerMount: {type: integer, minimum: 1, maximum: 64, default: 16}
        maximumPathBytes: {type: integer, minimum: 1, maximum: 16384, default: 4096}
        maximumPathSegments: {type: integer, minimum: 1, maximum: 512, default: 128}
    SiteObservabilityPolicy:
      type: object
      additionalProperties: false
      properties:
        accessLogEnabled: {type: boolean, default: true}
        usageMeteringEnabled: {type: boolean, default: true}
        traceSampleRatePerMille: {type: integer, minimum: 0, maximum: 1000, default: 10}
    SiteCompositionResponse:
      type: object
      additionalProperties: false
      required: [siteId, siteVersion, revision, runtimeAssignments]
      properties:
        siteId:
          type: string
          format: uuid
        siteVersion:
          type: string
          pattern: '^[0-9]+$'
        revision:
          $ref: '#/components/schemas/SiteRevisionResponse'
        runtimeAssignments:
          type: array
          items:
            $ref: '#/components/schemas/SiteRuntimeAssignmentResponse'
    SiteRevisionResponse:
      type: object
      additionalProperties: false
      required: [id, number, descriptorSha256, validationStatus]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, pattern: '^[0-9]+$'}
        descriptorSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        validationStatus: {type: string, enum: [VALID, INVALID]}
    SiteRuntimeAssignmentResponse:
      type: object
      additionalProperties: false
      required: [targetId, assignmentId, generation, status]
      properties:
        targetId: {type: string, format: uuid}
        assignmentId: {type: string, format: uuid}
        generation: {type: string, pattern: '^[1-9][0-9]*$'}
        status: {type: string, enum: [PENDING, PUBLISHING, PUBLISHED, FAILED, SUPERSEDED]}
    SiteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        siteType:
          type: integer
        status:
          type: integer
        runtimeConfig:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: '^[0-9]+$'
    SitePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    CreateDomainZoneRequest:
      type: object
      additionalProperties: false
      required: [apexHostname]
      properties:
        apexHostname:
          type: string
          minLength: 3
          maxLength: 253
          description: >
            A registrable root domain (zone apex) such as example.com or
            example.co.uk. Wildcard names and subdomains are not accepted;
            Unicode (IDN) names are converted to punycode automatically. The
            apex must not already exist as a hostname and must not overlap an
            existing root domain.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        dnsProvider:
          type: string
          minLength: 1
          maxLength: 64
        providerZoneRef:
          type: string
          minLength: 1
          maxLength: 512
    UpdateDomainZoneRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        dnsProvider:
          type: string
          minLength: 1
          maxLength: 64
        providerZoneRef:
          type: string
          minLength: 1
          maxLength: 512
        status:
          type: string
          enum: [ACTIVE, PAUSED]
    DomainZoneResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - apexHostname
        - status
        - hostnameCount
        - verifiedHostnameCount
        - certificateCount
        - bindingCount
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        apexHostname:
          type: string
        displayName:
          type: string
        dnsProvider:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        hostnameCount:
          type: integer
          format: int64
          minimum: 0
        verifiedHostnameCount:
          type: integer
          format: int64
          minimum: 0
        certificateCount:
          type: integer
          format: int64
          minimum: 0
        bindingCount:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: '^[0-9]+$'
    CreateDomainHostnameRequest:
      type: object
      additionalProperties: false
      required: [relativeName]
      properties:
        relativeName:
          type: string
          minLength: 1
          maxLength: 253
          description: >
            Relative name within the zone: "@" addresses the apex (already part
            of the zone), a label path such as www or api.eu creates
            multi-level subdomains, and "*" or "*.a" creates wildcard hostnames
            (the "*" label is accepted only as the leftmost label). Names are
            ASCII-only after IDNA conversion; leading/trailing dots, empty
            labels, and hyphen-edged labels are rejected.
    DomainHostnameResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - zoneId
        - hostname
        - relativeName
        - hostnameType
        - verificationStatus
        - status
        - certificateCount
        - bindingCount
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        hostname:
          type: string
        relativeName:
          type: string
        hostnameType:
          type: string
          enum: [EXACT, WILDCARD]
        verificationStatus:
          type: string
          enum: [PENDING, VERIFIED, FAILED, EXPIRED]
        verifiedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        certificateCount:
          type: integer
          format: int64
          minimum: 0
        bindingCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: '^[0-9]+$'
    DomainVerifyResponse:
      type: object
      required:
        - verified
        - method
      properties:
        verified:
          type: boolean
        method:
          type: string
          enum:
            - DNS_TXT
        verificationId:
          type: string
          format: uuid
          description: "当前所有权验证尝试标识；域名已验证时可省略。"
        recordName:
          type: string
          description: "需要配置 TXT 记录的完整规范名称；域名已验证时可省略。"
        token:
          type: string
          description: "仅在创建验证尝试时返回一次的明文 proof；后续查询和验证响应不会再次返回。"
        expiresAt:
          type: string
          format: date-time
          description: "当前验证尝试的失效时间；域名已验证时可省略。"
    CreateDeploymentRequest:
      type: object
      required:
        - deployType
      properties:
        deployType:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
        versionTag:
          type: string
          maxLength: 100
        commitHash:
          type: string
        sourceRef:
          type: string
        environment:
          type: string
          default: production
        releaseId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          maxLength: 200
    DeploymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        deployType:
          type: integer
        releaseId:
          type: string
          format: uuid
        versionTag:
          type: string
        status:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
