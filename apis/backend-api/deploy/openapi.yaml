openapi: 3.1.2
info:
  title: SDKWork Deploy Backend API
  description: SDKWork Deploy Server 绠＄悊鍚庡彴 API
  version: 1.0.0
servers:
- url: https://api.deploy.sdkwork.com
  description: Production
- url: http://localhost:3900
  description: Local Development
security:
- AuthToken: []
  AccessToken: []
paths:
  /backend/v3/api/nginx/configs:
    get:
      operationId: nginx.configs.list
      summary: 鑾峰彇 Nginx 閰嶇疆鍒楄〃
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - name: siteId
        in: query
        schema:
          type: string
          format: uuid
      - name: configType
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
      - name: isActive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: 鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/NginxConfigResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    post:
      operationId: nginx.configs.create
      summary: 鍒涘缓 Nginx 閰嶇疆
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNginxConfigRequest'
      responses:
        '201':
          description: 鍒涘缓鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxConfigResponse'
  /backend/v3/api/nginx/configs/{configId}:
    parameters:
    - name: configId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: nginx.configs.retrieve
      summary: 鑾峰彇 Nginx 閰嶇疆璇︽儏
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: 鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxConfigResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: nginx.configs.update
      summary: 鏇存柊 Nginx 閰嶇疆
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNginxConfigRequest'
      responses:
        '200':
          description: 鏇存柊鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxConfigResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /backend/v3/api/nginx/configs/{configId}/validate:
    parameters:
    - name: configId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: nginx.configs.validate
      summary: 鏍￠獙 Nginx 閰嶇疆
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: 鏍￠獙缁撴灉
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxValidateResponse'
  /backend/v3/api/nginx/configs/{configId}/deploy:
    parameters:
    - name: configId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: nginx.configs.deploy
      summary: 閮ㄧ讲 Nginx 閰嶇疆
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: 閮ㄧ讲鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxDeployResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /backend/v3/api/nginx/reload:
    post:
      operationId: nginx.reload
      summary: "鐑\uDCAD鍔犺浇 Nginx"
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: "鐑\uDCAD鍔犺浇缁撴灉"
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxReloadResponse'
  /backend/v3/api/nginx/status:
    get:
      operationId: nginx.status.retrieve
      summary: "鑾峰彇 Nginx 鐘舵\uDC80\uDC81"
      tags:
      - nginx
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: 鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/NginxStatusResponse'
  /backend/v3/api/servers:
    get:
      operationId: servers.list
      summary: "鑾峰彇鏈嶅姟鍣ㄥ垪琛\uDCA8"
      tags:
      - server
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/ServerResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    post:
      operationId: servers.create
      summary: "娉ㄥ唽鏈嶅姟鍣\uDCA8"
      tags:
      - server
      security:
      - AuthToken: []
        AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: 娉ㄥ唽鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ServerResponse'
  /backend/v3/api/audit_logs:
    get:
      operationId: auditLogs.list
      summary: "鑾峰彇瀹¤\uDCAE℃棩蹇楀垪琛\uDCA8"
      tags:
      - audit
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - name: targetType
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: operatorId
        in: query
        schema:
          type: integer
          format: int64
      - name: startDate
        in: query
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 鎴愬姛
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/AuditLogResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/SdkWorkPlatformErrorCode'
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        i18nKey:
          type: string
          description: Optional stable localization key such as errors.result.40001.
        locale:
          type: string
          description: Optional effective BCP 47 locale used by framework message
            mapping.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    CreateNginxConfigRequest:
      type: object
      required:
      - configType
      - configName
      - configContent
      properties:
        configType:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
        configName:
          type: string
          maxLength: 200
        configContent:
          type: string
        siteId:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
    UpdateNginxConfigRequest:
      type: object
      properties:
        configContent:
          type: string
        configName:
          type: string
          maxLength: 200
    NginxConfigResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        configType:
          type: integer
        configName:
          type: string
        configContent:
          type: string
        configHash:
          type: string
        isActive:
          type: boolean
        versionNo:
          type: integer
        deployedAt:
          type: string
          format: date-time
        status:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NginxConfigPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NginxConfigResponse'
        total:
          type: integer
          format: int64
    NginxValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              message:
                type: string
              severity:
                type: string
                enum:
                - error
                - warning
                - info
    NginxDeployResponse:
      type: object
      properties:
        success:
          type: boolean
        configId:
          type: string
          format: uuid
        deployedAt:
          type: string
          format: date-time
        reloadResult:
          type: object
          properties:
            reloaded:
              type: boolean
            message:
              type: string
    NginxReloadResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    NginxStatusResponse:
      type: object
      properties:
        running:
          type: boolean
        version:
          type: string
        pid:
          type: integer
        activeConnections:
          type: integer
        configPath:
          type: string
        uptime:
          type: string
    CreateServerRequest:
      type: object
      required:
      - name
      - host
      - sshPort
      properties:
        name:
          type: string
          maxLength: 100
        host:
          type: string
          maxLength: 255
        sshPort:
          type: integer
          default: 22
        sshUser:
          type: string
          default: root
        sshKeyPath:
          type: string
        description:
          type: string
          maxLength: 500
    ServerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        sshPort:
          type: integer
        status:
          type: integer
        createdAt:
          type: string
          format: date-time
    ServerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServerResponse'
        total:
          type: integer
          format: int64
    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        operatorId:
          type: integer
          format: int64
        operatorType:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: integer
          format: int64
        targetUuid:
          type: string
        ipAddress:
          type: string
        changes:
          type: object
        createdAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        total:
          type: integer
          format: int64
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - data
      - traceId
      properties:
        code:
          type: integer
          format: int32
          enum:
          - 0
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload typed per response schema.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
    SdkWorkResourceData:
      type: object
      additionalProperties: false
      required:
      - item
      properties:
        item:
          type: object
          additionalProperties: true
          description: Typed domain resource for the operation.
    SdkWorkPageData:
      type: object
      additionalProperties: false
      required:
      - items
      - pageInfo
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    SdkWorkCommandData:
      type: object
      additionalProperties: false
      required:
      - accepted
      properties:
        accepted:
          type: boolean
          const: true
        resourceId:
          type: string
        status:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - offset
          - cursor
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: string
          pattern: ^[0-9]+$
        totalPages:
          type: integer
          minimum: 0
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    SdkWorkPlatformErrorCode:
      type: integer
      format: int32
      minimum: 40001
      maximum: 79999
      description: Platform or domain error code per API_SPEC.md 搂15.3.
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: integer
          format: int32
          minimum: 40011
          maximum: 40099
        i18nKey:
          type: string
        params:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
    SdkWorkResourceResponse:
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SdkWorkResourceData'
    SdkWorkListResponse:
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SdkWorkPageData'
    SdkWorkCommandResponse:
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SdkWorkCommandData'
  responses:
    BadRequest:
      description: "璇锋眰鍙傛暟閿欒\uDCAF\uDCAF"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: "鏈\uDCAA璁よ瘉"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: "璧勬簮涓嶅瓨鍦\uDCA8"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 璧勬簮鍐茬獊
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
