  /backend/v3/api/source_events:
    get:
      operationId: sourceEvents.list
      summary: List ingested Git webhook events
      description: >
        Backend management surface over the CI event log (deduplicated per
        repository commit). Tenant-scoped when the token carries a tenant.
      tags:
        - sourceEvents
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/SourceEventResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          description: "未认证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: sourceEvents.ingest
      summary: Ingest a Git webhook push event and trigger builds
      description: >
        GitHub-compatible webhook endpoint. The X-Hub-Signature-256 HMAC
        header is verified against SDKWORK_DEPLOY_WEBHOOK_SECRET (endpoint
        fails closed without it). Push events on the repository's default
        branch trigger builds for every active platform target with a
        governed template; events are deduplicated per commit.
      tags:
        - sourceEvents
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "GitHub push webhook payload (ref, repository.clone_url, head_commit)"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/SourceEventIngestResponse'
        '401':
          description: "签名校验失败"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: "校验错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable command identity. Reuse with a different request is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/SdkWorkPlatformErrorCode'
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        i18nKey:
          type: string
          description: Optional stable localization key such as errors.result.40001.
        locale:
          type: string
          description: Optional effective BCP 47 locale used by framework message mapping.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    CreateNginxConfigRequest:
      type: object
      required:
        - configType
        - configName
        - configContent
      properties:
        configType:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
        configName:
          type: string
          maxLength: 200
        configContent:
          type: string
        siteId:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
    UpdateNginxConfigRequest:
      type: object
      properties:
        configContent:
          type: string
        configName:
          type: string
          maxLength: 200
    NginxConfigResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        configType:
          type: integer
        configName:
          type: string
        configContent:
          type: string
        configHash:
          type: string
        isActive:
          type: boolean
        versionNo:
          type: integer
        deployedAt:
          type: string
          format: date-time
        status:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NginxConfigPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NginxConfigResponse'
        total:
          type: integer
          format: int64
    NginxValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              message:
                type: string
              severity:
                type: string
                enum:
                  - error
                  - warning
                  - info
    NginxDeployResponse:
      type: object
      properties:
        success:
          type: boolean
        configId:
          type: string
          format: uuid
        deployedAt:
          type: string
          format: date-time
        reloadResult:
          type: object
          properties:
            reloaded:
              type: boolean
            message:
              type: string
    NginxReloadResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    NginxStatusResponse:
      type: object
      properties:
        running:
          type: boolean
        version:
          type: string
        pid:
          type: integer
        activeConnections:
          type: integer
        configPath:
          type: string
        uptime:
          type: string
    CreateServerRequest:
      type: object
      required:
        - name
