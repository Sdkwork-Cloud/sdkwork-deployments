openapi: 3.1.2
info:
  title: SDKWork Deploy Backend API
  description: SDKWork Deploy Server API
  version: 1.0.0
servers:
  - url: https://api.deploy.sdkwork.com
    description: Production
  - url: http://localhost:3900
    description: Local Development
security:
  - AuthToken: []
    AccessToken: []
paths:
  /backend/v3/api/nginx/configs:
    get:
      operationId: configs.list
      summary: 获取 Nginx 配置列表
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: site_id
          in: query
          schema:
            type: string
            format: uuid
        - name: config_type
          in: query
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/NginxConfigResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
    post:
      operationId: configs.create
      summary: 创建 Nginx 配置
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNginxConfigRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxConfigResponse'
  /backend/v3/api/nginx/configs/{configId}:
    parameters:
      - name: configId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: configs.retrieve
      summary: 获取 Nginx 配置详情
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxConfigResponse'
        '404':
          description: "资源不存在"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      operationId: configs.update
      summary: 更新 Nginx 配置
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNginxConfigRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxConfigResponse'
        '404':
          description: "资源不存在"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/nginx/configs/{configId}/validate:
    parameters:
      - name: configId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: configs.validate
      summary: 校验 Nginx 配置
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxValidateResponse'
  /backend/v3/api/nginx/configs/{configId}/deploy:
    parameters:
      - name: configId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: configs.deploy
      summary: 部署 Nginx 配置
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: 部署成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxDeployResponse'
        '400':
          description: "请求参数错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/nginx/reload:
    post:
      operationId: runtime.reload
      summary: "热加载 Nginx"
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: "热加载结果"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxReloadResponse'
  /backend/v3/api/nginx/status:
    get:
      operationId: runtime.retrieve
      summary: "获取 Nginx 状态"
      tags:
        - nginx
      security:
        - AuthToken: []
          AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NginxStatusResponse'
  /backend/v3/api/servers:
    get:
      operationId: servers.list
      summary: "获取服务器节点列表"
      tags:
        - server
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: cluster_id
          in: query
          schema:
            type: string
            format: uuid
          description: 按节点集群过滤
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ServerResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
    post:
      operationId: servers.create
      summary: "注册服务器节点"
      tags:
        - server
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/ServerResponse'
  /backend/v3/api/servers/{serverId}:
    put:
      operationId: servers.update
      summary: "更新服务器节点"
      tags:
        - server
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/ServerResponse'
  /backend/v3/api/node_clusters:
    get:
      operationId: clusters.list
      summary: "获取节点集群列表"
      tags:
        - cluster
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/NodeClusterResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
    post:
      operationId: clusters.create
      summary: "创建节点集群"
      tags:
        - cluster
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeClusterRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NodeClusterResponse'
  /backend/v3/api/node_clusters/{clusterId}:
    put:
      operationId: clusters.update
      summary: "更新节点集群"
      tags:
        - cluster
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeClusterRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/NodeClusterResponse'
  /backend/v3/api/audit_logs:
    get:
      operationId: auditLogs.list
      summary: "获取审计日志列表"
      tags:
        - audit
      security:
        - AuthToken: []
          AccessToken: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: target_type
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: operator_id
          in: query
          schema:
            type: integer
            format: int64
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: "不透明 keyset 续页令牌（PAGINATION_SPEC §6），提供时走 cursor 模式且过滤器不适用"
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/AuditLogResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
  /backend/v3/api/entitlements:
    get:
      operationId: entitlements.list
      summary: List Commerce-backed entitlement projections
      description: >
        Platform management surface. Tenant-scoped when the token carries a
        tenant; platform-wide for platform operators. Deploy enforces these
        projections on capacity creation when enforcement is enabled.
      tags:
        - entitlement
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/EntitlementProjectionResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          description: "未认证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/build_queue:
    get:
      operationId: buildQueue.list
      summary: List queued builds waiting for or claimed by runners
      description: >
        Backend build fleet administration surface: QUEUED/PREPARING builds
        oldest first, tenant-scoped when the token carries a tenant.
      tags:
        - buildQueue
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/BuildQueueItemResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          description: "未认证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/runners:
    get:
      operationId: runners.list
      summary: List runner liveness and workload health
      description: >
        Backend build fleet administration surface: per-runner last seen,
        completed/failed/active build counts.
      tags:
        - runners
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/RunnerHealthResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          description: "未认证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/tls/accounts:
    get:
      operationId: tlsAccounts.list
      summary: List ACME accounts of the tenant
      tags:
        - tls
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [items, pageInfo]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/AcmeAccountResponse'
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          description: "未认证"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: tlsAccounts.create
      summary: Create an ACME account binding
      description: >
        Registers the CA profile, directory URL, contact, and (optional)
        external account digest for the tenant. The account key material is a
        secret reference only; the ACME client boundary uses it during
        issuance once credential integration exists.
      tags:
        - tls
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      x-sdkwork-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAcmeAccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/AcmeAccountResponse'
        '422':
          description: "校验错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/tls/orders:
    post:
      operationId: tlsOrders.request
      summary: Request a certificate order for a certificate
      description: >
        Creates an order (idempotent on the idempotency key) with one HTTP_01
        (or DNS_01) challenge per certificate identifier. The order then walks
        the canonical state machine via advance / challenge_result / versions.
      tags:
        - tls
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      x-sdkwork-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCertificateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/CertificateOrderResponse'
        '422':
          description: "校验错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/tls/orders/{orderId}/advance:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: tlsOrders.advance
      summary: Advance a certificate order one canonical state machine step
      tags:
        - tls
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: '#/components/schemas/CertificateOrderResponse'
        '409':
          description: "冲突"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/tls/orders/{orderId}/fail:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: tlsOrders.fail
      summary: Fail a certificate order with a stable error code
      tags:
        - tls
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailCertificateOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            type: object
        '422':
          description: "校验错误"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /backend/v3/api/tls/orders/{orderId}/challenge_result:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: tlsOrders.challengeResult
      summary: Record a challenge validation result
      description: >
        A valid result advances the order to FINALIZING; an invalid result
        fails the order. The order keeps its state until all challenges are
        recorded valid.
      tags:
        - tls
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeResultRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
