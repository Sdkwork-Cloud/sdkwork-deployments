  /backend/v3/api/usage/reconcile:
    post:
      operationId: usage.reconcileDaily
      summary: Rebuild the daily usage aggregate from retained usage facts
      description: >
        Idempotent upsert of the reconcilable daily aggregate from the
        append-only usage events in the window (default: trailing 90 days).
