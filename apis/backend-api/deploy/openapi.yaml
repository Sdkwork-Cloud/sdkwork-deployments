      summary: Apply platform retention policies
      description: >
        Retires unreferenced packages and releases past their retention
        windows and purges expired build log references. Retention windows
        come from platform configuration (SDKWORK_DEPLOY_RETENTION_*_DAYS).
        dryRun=true (default) reports candidates without mutating.
