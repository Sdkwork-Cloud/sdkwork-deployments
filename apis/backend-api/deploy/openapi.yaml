        - sshPort
      properties:
        name:
          type: string
          maxLength: 100
        host:
          type: string
          maxLength: 255
        sshPort:
          type: integer
          default: 22
        clusterId:
          type: string
          format: uuid
          description: 所属节点集群
        sshUser:
          type: string
          default: root
        sshKeyPath:
          type: string
        description:
          type: string
          maxLength: 500
    UpdateServerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        sshPort:
          type: integer
        clusterId:
          type: string
          format: uuid
          description: 所属节点集群
