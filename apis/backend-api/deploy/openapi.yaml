          type: string
        description:
          type: string
          maxLength: 500
        status:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
          description: 状态：0=未连接，1=在线，2=离线，3=维护中
    ServerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        sshPort:
          type: integer
        clusterId:
          type: string
          format: uuid
        clusterName:
          type: string
        nodeRole:
          type: integer
          description: 节点角色：0=宿主节点，1=边缘节点
        status:
          type: integer
        sshUser:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    ServerPage:
      type: object
      properties:
        items:
          type: array
