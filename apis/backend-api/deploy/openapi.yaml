  /backend/v3/api/usage/ingest:
    post:
      operationId: usage.ingestTrafficEvents
      summary: Ingest Web Server traffic usage events (per-domain / per-server-IP)
      description: >
        Batch traffic usage facts submitted by Web Server nodes
        (`traffic.requests`, `traffic.ingress_bytes`, `traffic.egress_bytes`).
        Every event is deduplicated on (tenant, deduplicationKey); binding and
        site uuids are resolved to internal ids and tenant attribution is
        derived from the binding when the node could not attribute it.
      tags:
        - usage
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-permission: false
      requestBody:
        required: true
        content:
          application/json:
